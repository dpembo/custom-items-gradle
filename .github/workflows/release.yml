  combine:
    runs-on: ubuntu-latest
    needs: [editor, plug-in, mc1-12, mc1-13, mc1-14, mc1-15, mc1-16, mc1-17, mc1-18, mc1-19, mc1-20, mc1-21, mc26, ce-event-handler]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: plug-in-incomplete
          path: combined
      - uses: actions/download-artifact@v4
        with:
          name: ce-event-handler
          path: combined
      - uses: actions/download-artifact@v4
        with:
          name: kci-nms12
          path: combined
      - uses: actions/download-artifact@v4
        with:
          name: kci-nms13
          path: combined
      - uses: actions/download-artifact@v4
        with:
          name: kci-nms13plus
          path: combined
      - uses: actions/download-artifact@v4
        with:
          name: kci-nms14
          path: combined
      - uses: actions/download-artifact@v4
        with:
          name: kci-nms15
          path: combined
      - uses: actions/download-artifact@v4
        with:
          name: kci-nms16
          path: combined
      - uses: actions/download-artifact@v4
        with:
          name: kci-nms16plus
          path: combined
      - uses: actions/download-artifact@v4
        with:
          name: kci-nms17
          path: combined
      - uses: actions/download-artifact@v4
        with:
          name: kci-nms18
          path: combined
      - uses: actions/download-artifact@v4
        with:
          name: kci-nms18plus
          path: combined
      - uses: actions/download-artifact@v4
        with:
          name: kci-nms19
          path: combined
      - uses: actions/download-artifact@v4
        with:
          name: kci-nms20
          path: combined
      - uses: actions/download-artifact@v4
        with:
          name: kci-nms21plus
          path: combined
      - uses: actions/download-artifact@v4
        with:
          name: kci-nms21
          path: combined
      - uses: actions/download-artifact@v4
        with:
          name: kci-nms26plus
          path: combined
      - uses: actions/download-artifact@v4
        with:
          name: kci-nms26
          path: combined
      - run: unzip -d combined combined/kci-nms20-all.jar
      - run: rm combined/kci-nms20-all.jar
      - run: unzip -d combined -o combined/plug-in-all.jar
      - run: rm combined/plug-in-all.jar
      - run: cd combined && zip -r CustomItems.jar * && cd ..
      - run: mkdir releases
      - run: cp combined/CustomItems.jar releases/CustomItems.jar
      - uses: actions/download-artifact@v4
        with:
          name: editor
          path: releases
      - run: cp releases/editor-all.jar releases/Editor.jar
      - run: rm releases/editor-all.jar
      - uses: actions/download-artifact@v4
        with:
          name: editor-windows
          path: releases
      - uses: actions/download-artifact@v4
        with:
          name: editor-linux
          path: releases
      - uses: actions/download-artifact@v4
        with:
          name: editor-macosx
          path: releases
      - uses: actions/upload-artifact@v4
        with:
          name: releases
          path: releases

  # ---------------------------------------------------------------------
  # Everything from here down is new: it takes the "releases" artifact
  # bundle that `combine` produces and turns it into an actual tagged
  # GitHub Release, following the same version/snapshot convention used
  # across this fork's other repos.
  # ---------------------------------------------------------------------

  release:
    runs-on: ubuntu-latest
    needs: [combine]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Needed so we can look at previous tags/releases

      - name: Download combined release artifacts
        uses: actions/download-artifact@v4
        with:
          name: releases
          path: releases

      - name: Extract version from plugin.yml
        id: version
        run: |
          VERSION=$(grep -Po '(?<=^version: ")[^"]+' shared-code/src/main/resources/plugin.yml)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Detected version from shared-code/src/main/resources/plugin.yml: $VERSION"

      - name: Get latest release version
        id: latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Get the most recent release tag (if any exist)
          LATEST_TAG=$(gh release list --limit 1 --json tagName --jq '.[0].tagName' 2>/dev/null || echo "")

          if [ -z "$LATEST_TAG" ] || [ "$LATEST_TAG" = "null" ]; then
            echo "No previous releases found"
            echo "latest_version=" >> $GITHUB_OUTPUT
            echo "is_new_version=true" >> $GITHUB_OUTPUT
          else
            # Strip leading 'v' if present
            LATEST_VERSION=${LATEST_TAG#v}
            echo "Latest release version: $LATEST_VERSION"
            echo "latest_version=$LATEST_VERSION" >> $GITHUB_OUTPUT

            CURRENT="${{ steps.version.outputs.version }}"
            if [ "$CURRENT" = "$LATEST_VERSION" ]; then
              echo "Version has NOT changed → will create snapshot"
              echo "is_new_version=false" >> $GITHUB_OUTPUT
            else
              echo "Version HAS changed → will create clean release"
              echo "is_new_version=true" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Determine tag and release name
        id: naming
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          IS_NEW="${{ steps.latest.outputs.is_new_version }}"

          if [ "$IS_NEW" = "true" ]; then
            TAG="v${VERSION}"
            RELEASE_NAME="Knokko's Custom Items ${VERSION}"
            PRERELEASE=false

            if [[ "$VERSION" == *"-pre"* ]] || [[ "$VERSION" == *"SNAPSHOT"* ]] || [[ "$VERSION" == *"RC"* ]]; then
              PRERELEASE=true
            fi
          else
            TIMESTAMP=$(date -u +%Y%m%d%H%M)
            TAG="v${VERSION}-snapshot-${TIMESTAMP}"
            RELEASE_NAME="Knokko's Custom Items ${VERSION} Snapshot (${TIMESTAMP})"
            PRERELEASE=true
          fi

          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "release_name=$RELEASE_NAME" >> $GITHUB_OUTPUT
          echo "prerelease=$PRERELEASE" >> $GITHUB_OUTPUT

          echo "Tag          : $TAG"
          echo "Release name : $RELEASE_NAME"
          echo "Prerelease   : $PRERELEASE"

      - name: Rename release assets with version
        id: assets
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ls -la releases/

          mv releases/CustomItems.jar "releases/CustomItems-${VERSION}.jar"
          mv releases/Editor.jar "releases/Editor-${VERSION}.jar"
          mv releases/editor-windows.zip "releases/editor-windows-${VERSION}.zip"
          mv releases/editor-linux.zip "releases/editor-linux-${VERSION}.zip"
          mv releases/editor-macosx.zip "releases/editor-macosx-${VERSION}.zip"

          ls -lh releases/

      - name: Create GitHub Release and upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.naming.outputs.tag }}"
          NAME="${{ steps.naming.outputs.release_name }}"
          PRERELEASE="${{ steps.naming.outputs.prerelease }}"
          VERSION="${{ steps.version.outputs.version }}"
          SHA="${{ github.sha }}"

          NOTES=$(cat <<EOF
          Automated build of **Knokko's Custom Items (KCI)**

          - **Version:** \`${VERSION}\`
          - **Commit:** ${SHA}
          - **Date:** $(date -u +"%Y-%m-%d %H:%M UTC")

          ### Assets
          - \`CustomItems-${VERSION}.jar\` — put this in your server's \`plugins\` folder
          - \`Editor-${VERSION}.jar\` — raw editor jar, requires a local Java installation
          - \`editor-windows-${VERSION}.zip\` — bundled Windows editor, no Java required
          - \`editor-linux-${VERSION}.zip\` — bundled Linux editor, no Java required
          - \`editor-macosx-${VERSION}.zip\` — bundled macOS editor, no Java required
          EOF
          )

          ASSETS=(
            "releases/CustomItems-${VERSION}.jar"
            "releases/Editor-${VERSION}.jar"
            "releases/editor-windows-${VERSION}.zip"
            "releases/editor-linux-${VERSION}.zip"
            "releases/editor-macosx-${VERSION}.zip"
          )

          if [ "$PRERELEASE" = "true" ]; then
            gh release create "$TAG" \
              --title "$NAME" \
              --notes "$NOTES" \
              --prerelease \
              "${ASSETS[@]}"
          else
            gh release create "$TAG" \
              --title "$NAME" \
              --notes "$NOTES" \
              "${ASSETS[@]}"
          fi

          echo "Release created successfully: $TAG"
