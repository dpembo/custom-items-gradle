      - run: cp legacy-gradle/gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.jar
      - run: cp legacy-gradle/gradle/wrapper/gradle-wrapper.properties gradle/wrapper/gradle-wrapper.properties
      - run: cp legacy-gradle/gradlew gradlew
      - run: ./gradlew build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
