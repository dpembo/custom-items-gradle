      - uses: actions/upload-artifact@v4
        with:
          name: kci-nms18
          path: kci-nms18/build/classes/java/main
      - uses: actions/upload-artifact@v4
        with:
          name: kci-nms18plus
          path: kci-nms18plus/build/classes/java/main

  mc1-19:
