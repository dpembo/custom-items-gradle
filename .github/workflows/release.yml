          path: kci-nms14/build/classes/java/main

  mc1-15:
    runs-on: ubuntu-latest
    container:
      image: knokkogator/kci:0.1.2-mc1.15
    steps:
      - uses: actions/checkout@v4
      - run: cp .github/mc1.15/build.gradle build.gradle
      - run: cp .github/mc1.15/settings.gradle settings.gradle
      - run: cp legacy-gradle/gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.jar
      - run: cp legacy-gradle/gradle/wrapper/gradle-wrapper.properties gradle/wrapper/gradle-wrapper.properties
      - run: cp legacy-gradle/gradlew gradlew
      - run: ./gradlew build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: kci-nms15
          path: kci-nms15/build/classes/java/main

  mc1-16:
    runs-on: ubuntu-latest
    container:
